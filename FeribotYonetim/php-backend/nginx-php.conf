# ============================================
# FERİBOT YÖNETİM SİSTEMİ - Nginx + PHP-FPM
# ============================================
# Bu dosyayı /etc/nginx/sites-available/feribot.conf olarak kopyalayın
# sudo ln -s /etc/nginx/sites-available/feribot.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name siteniz.com www.siteniz.com;

    # HTTPS'e yönlendir
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name siteniz.com www.siteniz.com;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/siteniz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siteniz.com/privkey.pem;

    # SSL güvenlik ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Root dizini - PHP backend
    root /home/kullanici/htdocs/siteniz.com/php-backend;
    index index.php;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size
    client_max_body_size 10M;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static dosyalar (React build output)
    location /assets/ {
        alias /home/kullanici/htdocs/siteniz.com/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Upload dosyaları
    location /uploads/ {
        alias /home/kullanici/htdocs/siteniz.com/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # API istekleri -> PHP-FPM
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # React SPA - Diğer tüm istekler
    location / {
        root /home/kullanici/htdocs/siteniz.com/dist/public;
        try_files $uri $uri/ /index.html;
    }

    # Hassas dosyalara erişimi engelle
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location ~ /(config|migrations|models|middleware|core|logs)/ {
        deny all;
        return 404;
    }

    # Favicon ve robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Error log
    error_log /var/log/nginx/feribot-error.log;
    access_log /var/log/nginx/feribot-access.log;
}
